<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>到了叫我 - GPS 闹钟</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            --bg:#0a0f0d;--bg2:#111a15;--card:#1a2620;--card2:#1f2e27;
            --g:#3ddc84;--g2:#2ab56b;--gdim:rgba(61,220,132,0.15);
            --t:#e8f5ee;--t2:#8aab96;--t3:#4d7060;
            --b:rgba(61,220,132,0.12);--b2:rgba(61,220,132,0.25);
            --red:#ff6b6b;--warn:#ffd93d;
        }
        body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);width:100%;overflow-x:hidden}
        .app{display:flex;flex-direction:column;min-height:100svh;max-width:430px;margin:0 auto;position:relative}
        
        /* 头部和导航 */
        .statusbar{display:flex;justify-content:space-between;padding:12px 20px 4px;font-size:13px;font-weight:500}
        .header{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 12px}
        .brand-ico{width:36px;height:36px;border-radius:10px;background:#1a8f4f;display:flex;align-items:center;justify-content:center;font-size:18px}
        .brand h1{font-size:17px;font-weight:700}
        .brand p{font-size:11px;color:var(--t2)}

        .scroll-area{flex:1;overflow-y:auto;padding:0 16px 8px}
        .screen{display:none}.screen.active{display:block}
        
        /* 地图修复相关 */
        .map-wrap{
            height: 280px; /* 手机端固定高度 */
            border-radius:15px;overflow:hidden;border:1px solid var(--b);
            position:relative;margin-bottom:11px;background:#0d1f18;
            z-index: 1;
        }
        #map{width: 100%; height: 100%;}
        /* 地图黑夜模式滤镜 */
        .leaflet-tile-container {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(180deg) saturate(0.3);
        }
        .leaflet-container { background: #0d1f18 !important; }

        /* 搜索建议层级修复 */
        .search-wrap{position:relative;margin-bottom:11px;z-index: 100;}
        .search{background:var(--card);border:1px solid var(--b);border-radius:13px;padding:11px 14px;display:flex;align-items:center;gap:9px}
        .sinput{flex:1;background:none;border:none;outline:none;font-size:15px;color:var(--t)}
        .sugg{display:none;position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--b);border-radius:12px;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
        .sugg.show{display:block}
        .sitem{padding:12px;border-bottom:1px solid var(--b);cursor:pointer}

        /* 目的地卡片 */
        .dest{background:var(--card);border:1px solid var(--b);border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:11px;margin-bottom:11px}
        .dest-ico{width:40px;height:40px;border-radius:11px;background:#1a3f6e;display:flex;align-items:center;justify-content:center;font-size:20px}
        .dest-name{font-size:17px;font-weight:700}

        /* 按钮和组件 */
        .pills{display:flex;gap:6px}.pill{flex:1;padding:10px 0;border-radius:9px;text-align:center;font-size:13px;background:var(--bg2);border:1px solid var(--b);color:var(--t2)}
        .pill.active{background:var(--g);color:#0a2e1a;font-weight:700}
        .start-btn{width:100%;border-radius:15px;padding:18px;display:flex;align-items:center;justify-content:center;gap:12px;border:none;background:linear-gradient(135deg,#3ddc84,#2fd37c);margin-bottom:20px}
        .start-btn.armed{background:linear-gradient(135deg,#ff6b6b,#ff4444);color:#fff}
        
        .tabbar{display:flex;justify-content:space-around;padding:10px 0 25px;border-top:1px solid var(--b);background:var(--bg)}
        .tab{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--t3)}
        .tab.active{color:var(--g)}

        /* 警报遮罩 */
        .overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.96);flex-direction:column;align-items:center;justify-content:center;text-align:center}
        .overlay.show{display:flex}
        .dismiss{margin-top:30px;padding:15px 40px;border-radius:50px;background:var(--red);color:#fff;font-weight:700;border:none}
    </style>
</head>
<body>

<div class="app">
    <div class="statusbar">
        <span id="clk">00:00</span>
        <span>📶 🔋</span>
    </div>
    
    <div class="header">
        <div class="brand">
            <div class="brand-ico">📍</div>
            <div><h1>到了叫我</h1><p>GPS 地理围栏唤醒</p></div>
        </div>
    </div>

    <div class="scroll-area">
        <div class="screen active" id="s0">
            <div class="search-wrap">
                <div class="search">
                    <span>🔍</span>
                    <input id="si" class="sinput" type="search" placeholder="搜索目的地" oninput="doSearch(this.value)">
                </div>
                <div class="sugg" id="sugg"></div>
            </div>

            <div class="dest">
                <div class="dest-ico" id="dIco">🚆</div>
                <div class="dest-info">
                    <div style="font-size:11px;color:var(--t3)">目的地</div>
                    <div class="dest-name" id="dName">北京南站</div>
                </div>
            </div>

            <div id="strip" style="background:var(--gdim);padding:10px;border-radius:10px;margin-bottom:10px;display:none">
                <div style="display:flex;justify-content:space-between;font-size:13px">
                    <span>📏 当前距终点:</span>
                    <span id="curDist" style="color:var(--g);font-weight:700">探测中...</span>
                </div>
            </div>

            <div class="map-wrap">
                <div id="map"></div>
            </div>

            <div style="background:var(--card);padding:15px;border-radius:13px;margin-bottom:15px">
                <div style="color:var(--g);font-size:13px;margin-bottom:10px">● 触发距离设置</div>
                <div class="pills">
                    <div class="pill" onclick="setD(0.5,this)">500m</div>
                    <div class="pill" onclick="setD(1,this)">1km</div>
                    <div class="pill active" onclick="setD(2,this)">2km</div>
                    <div class="pill" onclick="setD(5,this)">5km</div>
                </div>
            </div>

            <button class="start-btn" id="startBtn" onclick="toggleArm()">
                <span id="aIco">⏰</span>
                <div style="text-align:left">
                    <div style="font-weight:700" id="btnTitle">开启 GPS 闹钟</div>
                    <div style="font-size:11px;opacity:0.8">进入警戒圈时将自动报警</div>
                </div>
            </button>
        </div>
    </div>

    <div class="tabbar">
        <div class="tab active"><span>🏠</span>首页</div>
        <div class="tab"><span>⏰</span>记录</div>
        <div class="tab"><span>🔔</span>设置</div>
        <div class="tab"><span>👤</span>我的</div>
    </div>

    <div class="overlay" id="overlay">
        <div style="font-size:80px">🚨</div>
        <h2 style="color:#fff;margin-top:20px">快到站了！</h2>
        <p id="oSt" style="color:var(--red);font-size:24px;font-weight:700;margin:10px 0">北京南站</p>
        <button class="dismiss" onclick="dismiss()">我已醒了！</button>
    </div>
</div>

<script>
// 1. 预设站点数据
const STATIONS = [
    {n:'北京南站',lat:39.8651,lng:116.3782,i:'🚆'},
    {n:'上海虹桥站',lat:31.1940,lng:121.3208,i:'🚄'},
    {n:'广州南站',lat:22.8095,lng:113.2665,i:'🚅'},
    {n:'深圳北站',lat:22.6064,lng:114.0289,i:'🚆'},
    {n:'杭州东站',lat:30.2919,lng:120.2165,i:'🚄'}
];

let map, circle, userMarker, destMarker;
let dist = 2, station = STATIONS[0], armed = false, fired = false, watchId = null;
let audioCtx = null, alarmTimer = null;

// 2. 初始化地图
function initMap() {
    map = L.map('map', { zoomControl: false }).setView([station.lat, station.lng], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    renderMarkers();
}

function renderMarkers() {
    if(circle) map.removeLayer(circle);
    if(destMarker) map.removeLayer(destMarker);
    
    // 目的地标记
    destMarker = L.marker([station.lat, station.lng], {
        icon: L.divIcon({html:`<div style="font-size:24px">${station.i}</div>`, className:'m-ico'})
    }).addTo(map);

    // 警戒圈
    circle = L.circle([station.lat, station.lng], {
        radius: dist * 1000,
        color: '#3ddc84',
        fillColor: '#3ddc84',
        fillOpacity: 0.1
    }).addTo(map);

    map.panTo([station.lat, station.lng]);
}

// 3. 搜索功能
function doSearch(v) {
    const sugg = document.getElementById('sugg');
    if(!v) { sugg.classList.remove('show'); return; }
    const res = STATIONS.filter(s => s.n.includes(v));
    sugg.innerHTML = res.map(s => `<div class="sitem" onclick="pick('${s.n}')">${s.n}</div>`).join('');
    sugg.classList.add('show');
}

function pick(name) {
    station = STATIONS.find(s => s.n === name);
    document.getElementById('dName').textContent = station.n;
    document.getElementById('oSt').textContent = station.n;
    document.getElementById('sugg').classList.remove('show');
    renderMarkers();
}

// 4. 定位与距离逻辑
function toggleArm() {
    if(armed) {
        stopWatching();
    } else {
        startWatching();
    }
}

function startWatching() {
    if (!navigator.geolocation) return alert("手机不支持GPS");
    
    armed = true;
    fired = false;
    document.getElementById('startBtn').classList.add('armed');
    document.getElementById('btnTitle').textContent = "停止监测";
    document.getElementById('strip').style.display = 'block';

    watchId = navigator.geolocation.watchPosition(pos => {
        const uLat = pos.coords.latitude;
        const uLng = pos.coords.longitude;
        
        // 更新用户在地图上的位置
        if(userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker([uLat, uLng], {radius:7, color:'#fff', fillColor:'#4da6ff', fillOpacity:1}).addTo(map);

        // 计算距离
        const d = map.distance([uLat, uLng], [station.lat, station.lng]) / 1000;
        document.getElementById('curDist').textContent = d < 1 ? Math.round(d*1000)+'m' : d.toFixed(2)+'km';

        if(d <= dist && !fired) triggerAlarm();
    }, err => console.error(err), {enableHighAccuracy:true});
}

function stopWatching() {
    armed = false;
    if(watchId) navigator.geolocation.clearWatch(watchId);
    document.getElementById('startBtn').classList.remove('armed');
    document.getElementById('btnTitle').textContent = "开启 GPS 闹钟";
    document.getElementById('strip').style.display = 'none';
}

// 5. 警报触发
function triggerAlarm() {
    fired = true;
    document.getElementById('overlay').classList.add('show');
    if(navigator.vibrate) navigator.vibrate([500, 300, 500, 300, 500]);
    
    // 简易音频提醒
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        alarmTimer = setInterval(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            osc.start(); osc.stop(audioCtx.currentTime + 1);
        }, 1200);
    } catch(e){}
}

function dismiss() {
    document.getElementById('overlay').classList.remove('show');
    if(alarmTimer) clearInterval(alarmTimer);
    if(navigator.vibrate) navigator.vibrate(0);
    stopWatching();
}

function setD(km, el) {
    dist = km;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    renderMarkers();
}

// 初始化
window.onload = () => {
    initMap();
    setInterval(() => {
        const n = new Date();
        document.getElementById('clk').textContent = n.getHours().toString().padStart(2,'0') + ':' + n.getMinutes().toString().padStart(2,'0');
    }, 1000);
};
</script>

</body>
</html>
